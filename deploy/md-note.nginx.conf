# nginx как фронт для md-note. Приложение крутится в docker compose
# и слушает 127.0.0.1:3000 — наружу смотрит только этот конфиг.
#
#   sudo cp deploy/md-note.nginx.conf /etc/nginx/sites-available/md-note
#   sudo ln -s /etc/nginx/sites-available/md-note /etc/nginx/sites-enabled/
#   sudo sed -i 's/notes.example.com/СВОЙ.ДОМЕН/g' /etc/nginx/sites-available/md-note
#   sudo nginx -t && sudo systemctl reload nginx
#
# Здесь только 80-й порт: `certbot --nginx` сам допишет listen 443,
# пути к сертификату и редирект с http. Пошагово — docs/деплой.md.

# Проброс WebSocket. Ветка '' → close нужна, чтобы обычные HTTP-запросы
# не получали Connection: upgrade и не теряли keepalive к приложению.
map $http_upgrade $md_note_connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name notes.example.com;

	# Загрузки файлов в приложении нет — только JSON с markdown-исходником.
	client_max_body_size 2m;

	# Браузер игнорирует HSTS, пришедший по http, так что реально заголовок
	# заработает после certbot. Остальные заголовки безопасности ставит
	# сам Next (next.config.ts) и CSP с nonce — middleware.
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;

		# Auth.js собирает callback URL из этих двух заголовков. Без них
		# после входа редиректит на http://localhost:3000 и вход ломается.
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host  $host;
		proxy_set_header Host              $host;

		# Именно $remote_addr, а не $proxy_add_x_forwarded_for: rate-limit
		# в приложении берёт первый адрес из X-Forwarded-For, а append
		# оставил бы первым подделанный клиентом заголовок — и лимит
		# обходился бы простой сменой этого значения.
		proxy_set_header X-Forwarded-For   $remote_addr;
		proxy_set_header X-Real-IP         $remote_addr;

		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $md_note_connection_upgrade;

		# App Router отдаёт HTML потоком; с буферизацией страница доедет
		# до браузера только целиком, и стриминг теряет смысл.
		proxy_buffering off;

		# Ответ приложение уже сжимает само (Next compress по умолчанию),
		# nginx повторно не жмёт — трогать gzip здесь не нужно.

		proxy_read_timeout 60s;
	}
}
