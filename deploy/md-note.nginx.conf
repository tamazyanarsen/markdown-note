# server-блок для md-note на СВОЁМ домене, у которого ещё нет сертификата.
#
# Если домен на сервере уже настроен и сертификат выпущен (типично для
# преднастроенных хостером доменов), этот файл не нужен — берите
# md-note-proxy.conf и подключайте его в существующий блок,
# см. docs/деплой.md, шаг 6, вариант Б.
#
#   cp deploy/md-note-proxy.conf /etc/nginx/snippets/md-note-proxy.conf
#   cp deploy/md-note.nginx.conf /etc/nginx/sites-available/md-note
#   sed -i 's/notes\.example\.com/СВОЙ.ДОМЕН/g' /etc/nginx/sites-available/md-note
#   ln -s /etc/nginx/sites-available/md-note /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Здесь только 80-й порт: `certbot --nginx` сам допишет listen 443,
# пути к сертификату и редирект с http.

server {
	listen 80;
	listen [::]:80;
	server_name notes.example.com;

	include /etc/nginx/snippets/md-note-proxy.conf;
}
