# Проксирование на md-note: приложение крутится в docker compose
# и слушает 127.0.0.1:3000.
#
# Файл подключается include-ом ВНУТРИ server-блока с TLS — отдельно от
# самого блока, чтобы одни и те же настройки годились и для своего домена
# (deploy/md-note.nginx.conf), и для домена, который уже настроен хостером.
# Куда класть и что дописать — docs/деплой.md, шаг 6.

# Загрузки файлов в приложении нет — только JSON с markdown-исходником.
client_max_body_size 2m;

# Остальные заголовки безопасности ставит сам Next (next.config.ts),
# CSP с nonce — middleware. HSTS ему взять неоткуда: про то, что снаружи
# https, знает только nginx.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

location / {
	proxy_pass http://127.0.0.1:3000;
	proxy_http_version 1.1;

	# Auth.js собирает callback URL из этих двух заголовков. Без них
	# после входа редиректит на http://localhost:3000 и вход ломается.
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host  $host;
	proxy_set_header Host              $host;

	# Именно $remote_addr, а не $proxy_add_x_forwarded_for: rate-limit
	# в приложении берёт первый адрес из X-Forwarded-For, а append
	# оставил бы первым подделанный клиентом заголовок — и лимит
	# обходился бы простой сменой этого значения.
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Real-IP       $remote_addr;

	# WebSocket приложение не использует, поэтому не проксируем Upgrade,
	# а пустой Connection включает keepalive до приложения.
	proxy_set_header Connection "";

	# App Router отдаёт HTML потоком; с буферизацией страница доедет
	# до браузера только целиком, и стриминг теряет смысл.
	proxy_buffering off;

	# Сжатие делает само приложение (у Next compress включён по умолчанию),
	# nginx повторно не жмёт.

	proxy_read_timeout 60s;
}
